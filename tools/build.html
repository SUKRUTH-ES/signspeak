<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landmark Builder</title>
  <style>
    :root { --bg: #fff; --text: #111; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111; --text: #eee; } }
    body { background: var(--bg); color: var(--text); font: 15px system-ui; padding: 16px; }
  </style>
</head>
<body>
  <h1>ASL landmark extraction</h1>
  <pre id="log">Starting…</pre>
  <script type="module">
    import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
    import { features } from "../features.js";

    const log = (m) => { document.getElementById("log").textContent = m; };
    window.buildDone = false;

    const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const hl = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "CPU",
      },
      runningMode: "IMAGE",
      numHands: 1,
      minHandDetectionConfidence: 0.3,
    });

    // optional ?per=N: take an even spread of N images per letter (faster builds)
    const per = parseInt(new URLSearchParams(location.search).get("per") || "0", 10);
    let manifest = await (await fetch("../data/images/manifest.json")).json();
    if (per > 0) {
      const byLabel = {};
      for (const m of manifest) (byLabel[m.label] ||= []).push(m);
      manifest = Object.values(byLabel).flatMap((list) => {
        const step = Math.max(1, list.length / per);
        return Array.from({ length: Math.min(per, list.length) }, (_, i) => list[Math.floor(i * step)]);
      });
    }
    const out = [];
    let miss = 0;
    for (let i = 0; i < manifest.length; i++) {
      const { label, src } = manifest[i];
      const img = new Image();
      img.src = "../data/images/" + src;
      try { await img.decode(); } catch { miss++; continue; }
      const res = hl.detect(img);
      const v = features(res);
      if (v) out.push({ label, v: v.slice(0, 63).map((x) => +x.toFixed(4)) });
      else miss++;
      if (i % 100 === 0) log(`${i}/${manifest.length} processed, ${out.length} hands found, ${miss} missed`);
    }
    log(`Done: ${out.length} hands found, ${miss} missed. Saving…`);
    const r = await fetch("/save", { method: "POST", body: JSON.stringify(out) });
    log(`Done: ${out.length} hands, ${miss} missed. Save: ${r.status}`);
    window.buildDone = true;
  </script>
</body>
</html>
